name: Nightly refresh

# Incremental ingest, then the data-quality regression guard.
#
# The order is the point: ingest first, validate second, and let validation fail
# the job. A refresh that silently pulls bad bars is worse than one that does not
# run, because every downstream backtest inherits them. `--fail-on-regression`
# compares severity counts against the previous run and exits non-zero if any
# severity worsened, so "the feed started returning zero volumes" becomes a
# failed job rather than a slow drift nobody reads.
#
# On failure an issue is opened (or an existing one commented) so the failure has
# somewhere to live besides a red tick in the Actions tab.

on:
  schedule:
    # 01:30 UTC = 07:00 IST, comfortably after the NSE close (10:00 UTC prev day)
    # and after vendor end-of-day files have settled.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run"
        required: false
        default: "manual refresh"

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    name: ingest --incremental · validate --fail-on-regression
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.report.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project
        run: uv pip install --system -e ".[data,research,api,postgres]"

      # A scheduled job has no persistent disk, so the database must be external.
      # QUANTLAB_DATABASE_URL is a repository secret pointing at the production
      # PostgreSQL. Absent, the job stops with a clear message instead of
      # "succeeding" against a throwaway SQLite file that resets every night —
      # which would make the regression guard permanently blind, since every run
      # would be its own baseline.
      - name: Check database is configured
        env:
          QUANTLAB_DATABASE_URL: ${{ secrets.QUANTLAB_DATABASE_URL }}
        run: |
          if [ -z "${QUANTLAB_DATABASE_URL}" ]; then
            echo "::error::QUANTLAB_DATABASE_URL secret is not set."
            echo "The nightly refresh needs a persistent database. A fresh SQLite"
            echo "file each night would make --fail-on-regression useless: every"
            echo "run would be a new baseline and nothing could ever regress."
            exit 1
          fi
          echo "database configured"

      - name: Migrate to head
        env:
          QUANTLAB_DATABASE_URL: ${{ secrets.QUANTLAB_DATABASE_URL }}
        run: alembic upgrade head

      - name: Ingest (incremental)
        id: ingest
        env:
          QUANTLAB_DATABASE_URL: ${{ secrets.QUANTLAB_DATABASE_URL }}
          QUANTLAB_ALPHA_VANTAGE_API_KEY: ${{ secrets.QUANTLAB_ALPHA_VANTAGE_API_KEY }}
        run: |
          set -o pipefail
          quantlab ingest --incremental 2>&1 | tee ingest.log

      - name: Validate (fail on regression)
        id: validate
        env:
          QUANTLAB_DATABASE_URL: ${{ secrets.QUANTLAB_DATABASE_URL }}
        run: |
          set -o pipefail
          quantlab validate --fail-on-regression 2>&1 | tee validate.log

      - name: Collect a report for the issue body
        id: report
        if: always()
        run: |
          {
            echo "summary<<REPORT_EOF"
            echo "### Ingest"
            echo '```'
            tail -n 30 ingest.log 2>/dev/null || echo "(no ingest output)"
            echo '```'
            echo "### Validation"
            echo '```'
            tail -n 40 validate.log 2>/dev/null || echo "(no validation output)"
            echo '```'
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: |
            ingest.log
            validate.log
          if-no-files-found: ignore

  open-issue:
    name: Open an issue on failure
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.refresh.outputs.summary }}
        with:
          script: |
            const title = "Nightly refresh failed";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body = [
              `The nightly ingest/validate job failed.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Commit:** \`${context.sha.slice(0, 8)}\``,
              ``,
              `A validation failure here usually means \`--fail-on-regression\``,
              `found more findings than the previous run — the feed changed, not`,
              `the code. Check the validation output before touching anything.`,
              ``,
              process.env.REPORT || "(no report captured)",
            ].join("\n");

            // Reuse an open issue rather than opening one per night: a feed that
            // has been broken for a week should be one thread, not seven.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly-failure",
              per_page: 1,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.info(`Commented on #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["nightly-failure", "data-quality"],
              });
              core.info(`Opened #${created.data.number}`);
            }
