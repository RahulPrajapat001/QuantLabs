[project]
name = "quantlab"
version = "0.1.0"
description = "A quantitative research platform for Indian equities (NSE)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "QuantLab" }]

# Core runtime dependencies kept intentionally small so the package imports and
# CI runs fast. The heavier scientific / ML / API / viz stacks live in the
# optional groups below and are pulled in per-milestone. See docs/PRD.md §6.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
# --- M1: Data Platform -------------------------------------------------------
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandera>=0.18",
    "exchange-calendars>=4.5",
    "requests>=2.31",
    "yfinance>=0.2.37",
    # Universe construction: HTML changes table (lxml powers pandas.read_html)
    # and NSE reconstitution PDFs.
    "lxml>=5.0",
    "pypdf>=4.0",
    # Feature engineering: per-security parallelism for the DAG build.
    "joblib>=1.3",
]
# --- M2: Research Engine -----------------------------------------------------
research = [
    "scipy>=1.12",
    "statsmodels>=0.14",
    "cvxpy>=1.4",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.44",
]
# --- M3: Interface -----------------------------------------------------------
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "plotly>=5.20",
    "streamlit>=1.33",
]
# --- M4: Reporting -----------------------------------------------------------
reports = [
    "weasyprint>=61.0",
]
# --- Tooling -----------------------------------------------------------------
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
]

[project.scripts]
quantlab = "quantlab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

# --- Ruff --------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Alembic migration scripts are autogenerated; their formatting and module names
# (revision hashes) are not ours to lint.
extend-exclude = [
    "docs",
    "notebooks",
    "frontend",
    "dashboard",
    "src/quantlab/db/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]
# The research-integrity modules quote Bailey & López de Prado's notation
# directly (γ3 for skew, γ4 for kurtosis) and parse en dashes in the
# pre-registration document's headings. Both are deliberate, not typos.
allowed-confusables = ["γ", "–"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
# Alembic's generated migration scripts are not type-checked.
exclude = ["src/quantlab/db/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# yfinance ships no type information; it is quarantined behind the provider
# abstraction and imported in exactly one module.
[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

# pypdf ships no type stubs; it is imported only inside the reconstitution parser.
[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

# joblib and pyarrow ship no type stubs; both are confined to the feature build.
[[tool.mypy.overrides]]
module = ["joblib.*", "pyarrow.*"]
ignore_missing_imports = true

# statsmodels and scipy ship no py.typed marker; they are wrapped by the stats,
# factors and research modules (PRD Modules 5, 6 and §4.4).
[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

# --- coverage ----------------------------------------------------------------
[tool.coverage.run]
source = ["src/quantlab"]
branch = true
