[project]
name = "quantlab"
version = "0.1.0"
description = "A quantitative research platform for Indian equities (NSE)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "QuantLab" }]

# Core runtime dependencies kept intentionally small so the package imports and
# CI runs fast. The heavier scientific / ML / API / viz stacks live in the
# optional groups below and are pulled in per-milestone. See docs/PRD.md §6.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
# --- M1: Data Platform -------------------------------------------------------
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    # Upper bound is a mypy constraint, not a runtime one: pyarrow 24.0 ships
    # `dataset`, `field` and `write_dataset` as untyped, so every call in
    # feature_engineering/build.py fails `--strict` with no-untyped-call. Lift
    # the bound once pyarrow's stubs cover pyarrow.dataset again.
    "pyarrow>=15.0,<24.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandera>=0.18",
    "exchange-calendars>=4.5",
    "requests>=2.31",
    "yfinance>=0.2.37",
    # Universe construction: HTML changes table (lxml powers pandas.read_html)
    # and NSE reconstitution PDFs.
    "lxml>=5.0",
    "pypdf>=4.0",
    # Feature engineering: per-security parallelism for the DAG build.
    "joblib>=1.3",
]
# --- M2: Research Engine -----------------------------------------------------
research = [
    "scipy>=1.12",
    "statsmodels>=0.14",
    "cvxpy>=1.4",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.44",
]
# --- M3: Interface -----------------------------------------------------------
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "plotly>=5.20",
    "streamlit>=1.33",
]
# The researcher-facing Streamlit dashboard. Split out from `api` because it is
# a *client* of the API, not part of it: a deployment that serves the API to the
# Next.js frontend has no reason to install Streamlit.
dashboard = [
    "streamlit>=1.33",
    "requests>=2.31",
]
# --- M4: Reporting -----------------------------------------------------------
reports = [
    "weasyprint>=61.0",
]
# --- M4: Production ----------------------------------------------------------
# PostgreSQL is the production target; SQLite stays the local-dev default. The
# driver is an extra rather than a core dependency so a developer running against
# SQLite does not need libpq installed.
postgres = [
    "psycopg[binary]>=3.1",
]
# --- Tooling -----------------------------------------------------------------
dev = [
    "pytest>=8.1",
    # FastAPI's TestClient is a thin wrapper over httpx.
    "httpx>=0.27",
    # The design-token generator emits Plotly templates; CI round-trips them
    # through Plotly's own validator (tests/design), so it needs plotly even
    # though the charting stack itself belongs to the api extra.
    "plotly>=5.20",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
]

[project.scripts]
quantlab = "quantlab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

# --- Ruff --------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Alembic migration scripts are autogenerated; their formatting and module names
# (revision hashes) are not ours to lint.
extend-exclude = [
    "docs",
    "notebooks",
    "frontend",
    "dashboard",
    "src/quantlab/db/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]
# Quantitative finance has standard notation and this codebase uses it: γ3/γ4 for
# skew and kurtosis (Bailey & López de Prado), ρ/σ/μ for correlation, volatility and
# mean, α/β for alpha and beta, Σ for the covariance matrix, δ/λ for shrinkage and
# penalty coefficients. Also en dashes in the pre-registration parser and × in the
# cost models' longhand arithmetic. All deliberate, none typos.
# U+2212 MINUS SIGN is required by docs/DESIGN_SYSTEM.md §5: a hyphen is
# narrower than a digit and breaks alignment in a tabular-figures column, which
# is the whole point of the monospace-numbers rule. Also the em dash used for
# null values.
allowed-confusables = [
    "γ", "ρ", "σ", "μ", "α", "β", "δ", "λ", "φ", "ω", "Σ", "Φ",
    "–", "—", "−", "×", "→", "≈", "≥", "≤",
]

# FastAPI's whole parameter API is function calls in argument defaults —
# Query(), Path(), Depends(), Body(). B008 exists to catch accidental shared
# mutable defaults, which these are not.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
# Alembic's generated migration scripts are not type-checked.
exclude = ["src/quantlab/db/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# yfinance ships no type information; it is quarantined behind the provider
# abstraction and imported in exactly one module.
[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

# pypdf ships no type stubs; it is imported only inside the reconstitution parser.
[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

# joblib and pyarrow ship no type stubs; both are confined to the feature build.
[[tool.mypy.overrides]]
module = ["joblib.*", "pyarrow.*"]
ignore_missing_imports = true

# WeasyPrint ships no py.typed marker. It is imported lazily inside
# quantlab.reports.tearsheet and nowhere else, because importing it binds to
# system libraries (Pango/Cairo) that a bare Windows host does not have.
[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

# XGBoost, LightGBM and SHAP ship no py.typed marker. All three are imported
# lazily inside quantlab.ml_models (PRD Module 11) and nowhere else, so the
# untyped surface is confined to the model registry and the SHAP explainer.
[[tool.mypy.overrides]]
module = ["xgboost.*", "lightgbm.*", "shap.*"]
ignore_missing_imports = true

# statsmodels and scipy ship no py.typed marker; they are wrapped by the stats,
# factors and research modules (PRD Modules 5, 6 and §4.4).
[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# cvxpy ships py.typed but its declared surface is incomplete: quad_form, psd_wrap,
# norm1, sum and log all exist at runtime and are absent from the type information,
# so analysing it produces false attr-defined errors on correct code. Skipping the
# import treats cvxpy as untyped, which is honest about what it actually provides.
# It is confined to quantlab.portfolio.optimisers.
[[tool.mypy.overrides]]
module = ["cvxpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    # End-to-end runs that stream a real backtest through the engine. Kept
    # marked so the fast suite stays fast, but they run in CI by default —
    # the job lifecycle is exactly the part worth exercising for real.
    "slow: exercises a full backtest through the API job queue",
]

# --- coverage ----------------------------------------------------------------
[tool.coverage.run]
source = ["src/quantlab"]
branch = true
