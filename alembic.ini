# Alembic configuration for QuantLab.
#
# The database URL is NOT set here — env.py reads it from Pydantic Settings
# (QUANTLAB_DATABASE_URL) so there is a single source of truth and no
# credentials live in a committed file (CLAUDE.md §5).

[alembic]
script_location = src/quantlab/db/migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is intentionally omitted; see env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
